<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Blueprint Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes abb-pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
      @keyframes abb-blink { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }
      @media (max-width: 640px) {
        div[style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
        div[style*="gap: 10"] { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
